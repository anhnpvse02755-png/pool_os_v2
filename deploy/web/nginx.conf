server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter dùng hash routing, nhưng vẫn cần fallback cho mọi đường dẫn
    # để người dùng gõ thẳng URL không bị 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bundle có hash trong tên -> cache dài. index.html thì không.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
