name: pool_os_v2
description: "PoolOS_v2 - AI Pool Training Platform"
publish_to: 'none'
version: 0.9.0+900

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Backend - Supabase
  supabase_flutter: ^2.8.2

  # HTTP & Network
  dio: ^5.8.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7

  # JSON Serialization
  json_annotation: ^4.9.0

  # Crypto (knowledge migration tool)
  crypto: ^3.0.3

  # Black Box Export
  archive: ^4.0.4
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/knowledge/
